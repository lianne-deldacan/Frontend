<div class="bg-[#F6E6CB] min-h-screen flex items-center justify-center">
  <div class="login-container max-w-sm w-full bg-white p-8 rounded-lg shadow-lg">
    <h2 class="text-3xl font-bold text-[#987070] text-center mb-6">Login</h2>
    <form (ngSubmit)="onSubmit()" [formGroup]="loginForm">
      <div class="mb-6">
        <label for="email" class="block text-[#987070] font-semibold mb-2">Email</label>
        <input id="email" formControlName="email" type="email"
          class="w-full px-4 py-2 border border-[#DBB5B5] rounded-md focus:outline-none focus:ring-2 focus:ring-[#D83F31] focus:border-[#D83F31]" />
      </div>
      <div class="mb-6">
        <label for="password" class="block text-[#987070] font-semibold mb-2">Password</label>
        <input id="password" formControlName="password" type="password"
          class="w-full px-4 py-2 border border-[#DBB5B5] rounded-md focus:outline-none focus:ring-2 focus:ring-[#D83F31] focus:border-[#D83F31]" />
      </div>
      <div class="mb-4 text-center text-sm sm:text-base">
        <p class="text-gray-600">No account yet?
          <b [routerLink]="'/signup'" class="text-[#987070] cursor-pointer hover:underline">Register here</b>
        </p>
      </div>
      <button type="submit"
        class="w-full bg-[#987070] text-white py-2 px-4 rounded-md hover:bg-[#DBB5B5] transition ease-in-out duration-300"
        [disabled]="loginForm.invalid">Login</button>
    </form>
    <p *ngIf="errorMessage" class="error text-red-500 text-center mt-4">{{ errorMessage }}</p>
  </div>
</div>
