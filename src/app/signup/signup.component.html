<div class="bg-[#F6E6CB] min-h-screen flex items-center justify-center">
  <div class="signup-container max-w-sm w-full bg-white p-8 rounded-lg shadow-lg">
    <h2 class="text-3xl font-bold text-[#987070] text-center mb-6">Signup</h2>
    <form (ngSubmit)="onSubmit()" [formGroup]="signupForm">
      <div class="mb-6">
        <label for="firstName" class="block text-[#987070] font-semibold mb-2">First Name</label>
        <input id="firstName" formControlName="firstName" type="text"
          class="w-full px-4 py-2 border border-[#DBB5B5] rounded-md focus:outline-none focus:ring-2 focus:ring-[#D83F31] focus:border-[#D83F31]" />
      </div>
      <div class="mb-6">
        <label for="lastName" class="block text-[#987070] font-semibold mb-2">Last Name</label>
        <input id="lastName" formControlName="lastName" type="text"
          class="w-full px-4 py-2 border border-[#DBB5B5] rounded-md focus:outline-none focus:ring-2 focus:ring-[#D83F31] focus:border-[#D83F31]" />
      </div>
      <div class="mb-6">
        <label for="email" class="block text-[#987070] font-semibold mb-2">Email</label>
        <input id="email" formControlName="email" type="email"
          class="w-full px-4 py-2 border border-[#DBB5B5] rounded-md focus:outline-none focus:ring-2 focus:ring-[#D83F31] focus:border-[#D83F31]" />
      </div>
      <div class="mb-6">
        <label for="password" class="block text-[#987070] font-semibold mb-2">Password</label>
        <input id="password" formControlName="password" type="password"
          class="w-full px-4 py-2 border border-[#DBB5B5] rounded-md focus:outline-none focus:ring-2 focus:ring-[#D83F31] focus:border-[#D83F31]" />
      </div>

<button type="submit"
  class="w-full bg-[#987070] text-white py-2 px-4 rounded-md hover:bg-[#DBB5B5] transition ease-in-out duration-300"
  [disabled]="signupForm.invalid">Signup</button>

    </form>
    <p *ngIf="errorMessage" class="error text-red-500 text-center mt-4">{{ errorMessage }}</p>
<div class="text-center mt-4">
  <p class="text-[#987070]">Already have an account?
    <a routerLink="/login" class="text-[#D83F31] font-semibold">Login here</a>
  </p>
</div>

  </div>
</div>
